version: '3'

includes:
  common: ../Taskfile.yml
  shared: ../common.yml

tasks:
  build:
    summary: Builds the Linux desktop application
    deps:
      - task: shared:go:mod:tidy
      - task: shared:build:frontend
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
    vars:
      BUILD_FLAGS: '-tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.VERSION}}"'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  run:
    summary: Runs the compiled Linux binary
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'

  package:
    summary: Builds a Linux AppImage / deb
    deps:
      - task: build
    cmds:
      - wails3 package -clean -platform linux/{{.ARCH | default ARCH}}
