version: '3'

vars:
  APP_NAME: BunkrDownloader
  BIN_DIR: bin
  VITE_PORT: 9245

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the desktop application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production installer
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  bindings:
    summary: Regenerates the frontend bindings
    cmds:
      - wails3 generate bindings

  dev:
    summary: Runs the app in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
