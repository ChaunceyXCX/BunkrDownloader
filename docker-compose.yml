# ============================================================================
#  BunkrDownloader · docker compose
#
#    docker compose up -d --build     启动
#    docker compose logs -f           查看日志
#    docker compose down              停止
#    docker compose down -v           停止并删除数据卷
#
#  浏览器打开 http://localhost:8765
# ============================================================================

name: bunkrdownloader

services:
  bunkr-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-1.0.0}
    image: ghcr.io/chaunceyxie1/bunkrdownloader:${VERSION:-latest}
    container_name: bunkr-web
    restart: unless-stopped

    ports:
      - "${BUNKR_PORT:-8765}:8765"

    environment:
      # --- server ---
      BUNKR_HOST: 0.0.0.0
      BUNKR_PORT: "8765"
      BUNKR_LOG_LEVEL: ${BUNKR_LOG_LEVEL:-INFO}
      BUNKR_ALLOW_ORIGIN: ${BUNKR_ALLOW_ORIGIN:-*}

      # --- storage ---
      BUNKR_DATA_DIR: /data
      BUNKR_DB: /data/bunkr.db
      BUNKR_DOWNLOAD_DIR: /downloads

      # --- auth / quotas ---
      # 生产环境请通过 .env 设置一个足够长的随机值
      BUNKR_JWT_SECRET: ${BUNKR_JWT_SECRET:-}
      BUNKR_JWT_TTL: ${BUNKR_JWT_TTL:-720h}
      BUNKR_FREE_LINKS_LIMIT: ${BUNKR_FREE_LINKS_LIMIT:-5}
      BUNKR_FREE_FILES_LIMIT: ${BUNKR_FREE_FILES_LIMIT:-50}
      BUNKR_FREE_CONCURRENCY: ${BUNKR_FREE_CONCURRENCY:-1}
      BUNKR_MEMBER_CONCURRENCY: ${BUNKR_MEMBER_CONCURRENCY:-5}

      # --- aria2 ---
      BUNKR_ARIA2_ENABLED: "true"
      # 使用镜像内置的 aria2c，不要在运行时联网下载
      BUNKR_ARIA2_BIN: /usr/bin/aria2c
      BUNKR_ARIA2_AUTO_FETCH: "false"
      BUNKR_ARIA2_HOST: 127.0.0.1
      BUNKR_ARIA2_PORT: "6800"
      BUNKR_ARIA2_SECRET: ${BUNKR_ARIA2_SECRET:-bunkr}
      BUNKR_ARIA2_MAX_CONCURRENT: ${BUNKR_ARIA2_MAX_CONCURRENT:-16}

      # --- membership ---
      BUNKR_PAYMENT_AUTO: ${BUNKR_PAYMENT_AUTO:-true}

      TZ: ${TZ:-UTC}

    volumes:
      # SQLite 数据库 + aria2 会话（断点续传依赖它，务必持久化）
      - bunkr-data:/data
      # 下载的文件
      - ${BUNKR_DOWNLOADS_PATH:-./downloads}:/downloads

    # aria2 + Go 运行时都只需要少量内存；下载并发由 BUNKR_ARIA2_MAX_CONCURRENT 控制
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 优雅停机：tini 转发 SIGTERM，Go 端会等待下载落盘
    stop_signal: SIGTERM
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

volumes:
  bunkr-data:
    name: bunkr-data
